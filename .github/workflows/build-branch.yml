name: build-branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (20.x) + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: corepack prepare pnpm@latest --activate

      - name: Install deps (pnpm if lockfile exists, else npm)
        id: install
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "Using pnpm"
            pnpm i --frozen-lockfile=false
            echo "build_cmd=pnpm build" >> "$GITHUB_OUTPUT"
          else
            echo "Using npm"
            npm ci || npm i
            echo "build_cmd=npm run build" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: ${{ steps.install.outputs.build_cmd }}

      - name: Prepare publish folder
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d dist ]; then
            echo "dist/ not found after build"; exit 1
          fi
          rm -rf publish && mkdir -p publish
          cp -r dist publish/
          cp package.json publish/
          [ -f README.md ] && cp README.md publish/ || true
          [ -f LICENSE ] && cp LICENSE publish/ || true

      - name: Commit to build branch (artifacts only)
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build artifacts from ${GITHUB_SHA}"
          git branch -M build
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin build